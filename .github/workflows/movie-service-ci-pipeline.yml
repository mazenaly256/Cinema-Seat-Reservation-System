name: Movie Service CI Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - "services/movie-service/src/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "services/movie-service/src/**"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & Build Service's Source Code
        run: |
          dotnet restore services/movie-service/src/movie-service.csproj
          dotnet build services/movie-service/src/movie-service.csproj --no-restore --configuration Release
