name: Reservation Service CI Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - "services/reservation-service/src/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "services/reservation-service/src/**"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore & Build
        run: |
          dotnet restore services/reservation-service/src/reservation-service.csproj
          dotnet build services/reservation-service/src/reservation-service.csproj --no-restore --configuration Release
